services:
  webapp:
    build: .
    ports:
      - "8080:5000"
    volumes:
      - ./data/cache:/app/webapp/cache
      - ./data/maps:/app/webapp/maps
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-uplandscope-change-this-in-prod}
      - ECONOMY_DB=/app/data/economy.db
    restart: unless-stopped
    mem_limit: 512m

  scraper:
    build: .
    command: python scraper/economy_scraper.py
    volumes:
      - ./data:/app/data
      - ./scraper/property_cache.json.gz:/app/scraper/property_cache.json.gz:ro
    env_file:
      - .env
    environment:
      - ECONOMY_DB=/app/data/economy.db
    restart: unless-stopped
    mem_limit: 256m
