services:
  webapp:
    build: .
    ports:
      - "8080:5000"
    volumes:
      - ./data/cache:/app/webapp/cache
      - ./data/maps:/app/webapp/maps
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-uplandscope-change-this-in-prod}
      - ECONOMY_DB=/app/data/economy.db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "400m"
        reservations:
          cpus: "0.1"

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    command: python /app/scraper/economy_scraper.py
    volumes:
      - ./data:/app/data
      - ./scraper/property_cache.json.gz:/app/scraper/property_cache.json.gz:ro
    env_file:
      - .env
    environment:
      - ECONOMY_DB=/app/data/economy.db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
        reservations:
          cpus: "0.1"
